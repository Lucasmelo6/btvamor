<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bate Volta do Amor</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --k:#080808;--k2:#111;--k3:#1a1a1a;--k4:#242424;--k5:#2e2e2e;
  --r:#D90429;--r2:#ef233c;--rd:rgba(217,4,41,.16);--rg:rgba(217,4,41,.32);
  --w:#fff;--w2:#e8e8e8;--w3:#bbb;
  --g:#666;--g2:#444;--g3:#333;
  --gr:#22c55e;--gd:rgba(34,197,94,.14);
  --am:#f59e0b;--ad:rgba(245,158,11,.14);
  --bl:#3b82f6;--bd:rgba(59,130,246,.14);
  --bdr:rgba(255,255,255,.07);
  --bdr-r:rgba(217,4,41,.28);
}
body.light{
  --k:#f4f4f5;--k2:#ffffff;--k3:#f0f0f2;--k4:#e8e8ea;--k5:#e0e0e3;
  --r:#D90429;--r2:#b00020;--rd:rgba(217,4,41,.1);--rg:rgba(217,4,41,.2);
  --w:#18181b;--w2:#27272a;--w3:#52525b;
  --g:#71717a;--g2:#a1a1aa;--g3:#d4d4d8;
  --gr:#16a34a;--gd:rgba(22,163,74,.12);
  --am:#d97706;--ad:rgba(217,119,6,.12);
  --bl:#2563eb;--bd:rgba(37,99,235,.12);
  --bdr:rgba(0,0,0,.1);
  --bdr-r:rgba(217,4,41,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Barlow',sans-serif;background:var(--k);color:var(--w);font-size:14px;line-height:1.5;transition:background .3s,color .3s}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--k2)}
::-webkit-scrollbar-thumb{background:var(--g2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--r)}

#login-screen{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:var(--k)}
.login-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 47px,rgba(255,255,255,.025) 48px),repeating-linear-gradient(90deg,transparent,transparent 47px,rgba(255,255,255,.025) 48px)}
.login-glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(217,4,41,.18),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:glow 5s ease-in-out infinite}
body.light .login-glow{background:radial-gradient(circle,rgba(217,4,41,.1),transparent 70%)}
body.light .login-grid{background-image:repeating-linear-gradient(0deg,transparent,transparent 47px,rgba(0,0,0,.03) 48px),repeating-linear-gradient(90deg,transparent,transparent 47px,rgba(0,0,0,.03) 48px)}
@keyframes glow{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.login-box{position:relative;z-index:2;width:400px;max-width:92vw;background:var(--k2);border:1px solid var(--bdr-r);border-radius:2px;padding:44px 36px;box-shadow:0 0 80px rgba(217,4,41,.15)}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand .hrt{font-size:2.8rem;display:block;animation:hb 2.2s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.login-brand h1{font-family:'Bebas Neue',sans-serif;font-size:2.6rem;letter-spacing:.06em;line-height:1;color:var(--w)}
.login-brand h1 span{color:var(--r)}
.login-brand p{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--g);margin-top:4px}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--g);margin-bottom:5px;font-weight:600}
.lf input{width:100%;padding:11px 13px;background:var(--k3);border:1px solid var(--bdr);border-radius:2px;color:var(--w);font-family:'Barlow',sans-serif;font-size:.9rem;transition:border-color .2s}
.lf input:focus{outline:none;border-color:var(--r);box-shadow:0 0 0 2px var(--rd)}
.btn-login-submit{width:100%;padding:13px;background:var(--r);border:none;border-radius:2px;color:var(--w);font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;cursor:pointer;transition:all .2s;margin-top:6px}
.btn-login-submit:hover{background:var(--r2);box-shadow:0 4px 24px var(--rg)}
.login-err{background:var(--rd);border:1px solid var(--bdr-r);color:var(--r2);padding:9px 12px;border-radius:2px;font-size:.8rem;margin-bottom:12px;display:none}

#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{height:50px;min-height:50px;background:var(--k2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 18px;gap:14px;position:relative;z-index:60}
.tb-brand{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.tb-brand .dot{color:var(--r)}
.tb-badge{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;padding:3px 9px;border-radius:20px;font-weight:700;border:1px solid}
.badge-master{background:rgba(217,4,41,.12);border-color:var(--bdr-r);color:var(--r2)}
.badge-admin{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:var(--am)}
.badge-monitor{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:var(--bl)}
.tb-user{font-size:.75rem;color:var(--g);margin-left:4px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-out{background:none;border:1px solid var(--bdr);border-radius:2px;padding:5px 13px;color:var(--g);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.btn-out:hover{border-color:var(--r);color:var(--r)}
.ham{background:none;border:none;color:var(--w);font-size:1.2rem;cursor:pointer;display:none;padding:4px}

.shell{flex:1;display:flex;overflow:hidden}
.sidebar{width:210px;min-width:210px;background:var(--k2);border-right:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column;transition:transform .28s}
.sb-section{padding:14px 0 4px}
.sb-label{font-size:.57rem;text-transform:uppercase;letter-spacing:.2em;color:var(--g2);padding:0 18px 7px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 18px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--g);border-left:2px solid transparent;transition:all .15s;white-space:nowrap}
.nav-item:hover{color:var(--w2);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--w);border-left-color:var(--r);background:var(--rd)}
.nav-item .ni{font-size:.95rem;width:17px;text-align:center}
.content{flex:1;overflow-y:auto;padding:26px}
.drawer-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:55}
.drawer-ov.on{display:block}

.ph{margin-bottom:22px}
.ph h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:.04em;line-height:1}
.ph p{font-size:.8rem;color:var(--g);margin-top:2px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:22px}
.sc{background:var(--k2);border:1px solid var(--bdr);border-radius:2px;padding:16px 18px;position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--r),transparent)}
.sc-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;color:var(--g);margin-bottom:5px}
.sc-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1}
.sc-sub{font-size:.68rem;color:var(--g);margin-top:3px}
.sc-icon{position:absolute;right:14px;top:12px;font-size:1.4rem;opacity:.12}

.card{background:var(--k2);border:1px solid var(--bdr);border-radius:2px;padding:18px;margin-bottom:18px}
.card-t{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.04em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-t-left{display:flex;align-items:center;gap:8px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.81rem}
thead th{text-align:left;padding:7px 11px;font-size:.58rem;text-transform:uppercase;letter-spacing:.13em;color:var(--g);border-bottom:1px solid var(--bdr);white-space:nowrap;font-weight:700}
tbody tr{border-bottom:1px solid rgba(255,255,255,.035);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:8px 11px;color:var(--w2)}

.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;border:1px solid}
.cg{background:var(--gd);color:var(--gr);border-color:rgba(34,197,94,.25)}
.cr{background:var(--rd);color:var(--r2);border-color:var(--bdr-r)}
.ca{background:var(--ad);color:var(--am);border-color:rgba(245,158,11,.25)}
.cb{background:var(--bd);color:var(--bl);border-color:rgba(59,130,246,.25)}
.cw{background:rgba(255,255,255,.07);color:var(--w3);border-color:var(--bdr)}

.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;color:var(--g);font-weight:700}
input,select,textarea{background:var(--k3);border:1px solid var(--bdr);border-radius:2px;padding:10px 12px;color:var(--w);font-family:'Barlow',sans-serif;font-size:.88rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r);box-shadow:0 0 0 2px var(--rd)}
input::placeholder{color:var(--g2)}
select option{background:var(--k3)}
input:disabled,select:disabled{opacity:.45;cursor:not-allowed}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:2px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;transition:all .18s;white-space:nowrap}
.br{background:var(--r);color:var(--w)}
.br:hover{background:var(--r2);box-shadow:0 4px 16px var(--rg)}
.bg{background:transparent;border:1px solid var(--bdr);color:var(--g)}
.bg:hover{border-color:var(--w2);color:var(--w2)}
.bsm{padding:6px 12px;font-size:.7rem}
.bxs{padding:4px 8px;font-size:.62rem}
.b-grn{background:var(--gd);border:1px solid rgba(34,197,94,.3);color:var(--gr)}
.b-grn:hover{background:rgba(34,197,94,.22)}
.b-am{background:var(--ad);border:1px solid rgba(245,158,11,.3);color:var(--am)}
.b-dng{background:var(--rd);border:1px solid var(--bdr-r);color:var(--r2)}
.b-dng:hover{background:rgba(217,4,41,.25)}
.b-bl{background:var(--bd);border:1px solid rgba(59,130,246,.3);color:var(--bl)}
.btn-row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}

.prog-wrap{margin-bottom:14px}
.prog-hd{display:flex;justify-content:space-between;font-size:.7rem;color:var(--g);margin-bottom:5px}
.prog-bar{height:5px;background:var(--k3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--k2);border:1px solid var(--bdr-r);border-radius:2px;padding:26px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 0 60px rgba(217,4,41,.12);animation:mi .2s ease}
.modal-lg{max-width:720px}
@keyframes mi{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-t{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.04em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.modal-close{margin-left:auto;background:none;border:none;color:var(--g);cursor:pointer;font-size:1.1rem;padding:3px;transition:color .15s}
.modal-close:hover{color:var(--r)}
.divider{height:1px;background:var(--bdr);margin:16px 0}

.toast{position:fixed;bottom:22px;right:22px;background:var(--k2);border:1px solid var(--bdr-r);padding:11px 18px;border-radius:2px;font-size:.82rem;transform:translateX(140%);transition:transform .28s;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:280px}
.toast.on{transform:translateX(0)}
.toast.tg{border-color:rgba(34,197,94,.4);color:var(--gr)}
.toast.tr{border-color:var(--bdr-r);color:var(--r2)}
.toast.ta{border-color:rgba(245,158,11,.4);color:var(--am)}

.ci-card{background:var(--k2);border:1px solid var(--bdr);border-radius:2px;margin-bottom:7px;transition:border-color .2s}
.ci-card.present{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.03)}
.ci-card.absent{border-color:rgba(217,4,41,.3)}
.ci-inner{display:flex;align-items:center;gap:13px;padding:11px 14px;cursor:pointer;user-select:none}
.ci-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;background:var(--k3);border:2px solid var(--bdr);flex-shrink:0;transition:all .2s}
.present .ci-av{background:var(--gd);border-color:rgba(34,197,94,.4);color:var(--gr)}
.absent .ci-av{background:var(--rd);border-color:var(--bdr-r);color:var(--r2)}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:.88rem}
.ci-sub{font-size:.7rem;color:var(--g);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
.ci-status{margin-left:auto}
.pay-warn{font-size:.62rem;padding:2px 7px;border-radius:20px;background:var(--ad);color:var(--am);border:1px solid rgba(245,158,11,.25)}

.comp-item{display:flex;align-items:center;gap:10px;background:var(--k3);border:1px solid var(--bdr);border-radius:2px;padding:9px 12px;margin-bottom:7px}
.comp-name{flex:1;font-size:.85rem;font-weight:500}
.comp-info{font-size:.7rem;color:var(--g)}
.add-comp{background:var(--k3);border:1px dashed var(--bdr);border-radius:2px;padding:13px;margin-top:7px}

.city-card{background:var(--k2);border:1px solid var(--bdr);border-radius:2px;padding:16px;margin-bottom:12px}
.city-name{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.04em;color:var(--w);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.city-details{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--g)}
.city-details span{color:var(--w2);font-weight:500}

.fbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end}
.fbar input,.fbar select{max-width:175px}

.cbar-wrap{display:flex;align-items:flex-end;gap:7px;height:90px;padding-top:8px}
.cbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cbar{width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--r2),var(--r));min-height:2px}
.cbar-v{font-size:.62rem;color:var(--r2);font-weight:700}
.cbar-l{font-size:.58rem;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;text-align:center}

.toggle{position:relative;display:inline-block;width:40px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.tslider{position:absolute;cursor:pointer;inset:0;background:var(--g2);border-radius:22px;transition:.3s}
.tslider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:var(--w);border-radius:50%;transition:.3s}
input:checked+.tslider{background:var(--gr)}
input:checked+.tslider:before{transform:translateX(18px)}

.tag{display:inline-flex;align-items:center;gap:5px;background:var(--k3);border:1px solid var(--bdr);border-radius:2px;padding:4px 10px;margin:0 4px 4px 0;font-size:.78rem}
.tag button{background:none;border:none;color:var(--g);cursor:pointer;font-size:.8rem;padding:0 0 0 4px}
.tag button:hover{color:var(--r)}

.loader-box{text-align:center}
.loader-spinner{width:36px;height:36px;border:3px solid var(--bdr);border-top-color:var(--r);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-indicator{position:fixed;top:10px;right:12px;font-size:.65rem;color:var(--gr);background:var(--gd);border:1px solid rgba(34,197,94,.3);padding:3px 9px;border-radius:20px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.sync-indicator.on{opacity:1}
.eye-btn{background:none;border:none;cursor:pointer;font-size:.85rem;padding:0 0 0 5px;opacity:.65;transition:opacity .2s;vertical-align:middle}
.eye-btn:hover{opacity:1}

@media(max-width:768px){
  .sidebar{position:fixed;top:50px;bottom:0;left:0;z-index:56;transform:translateX(-100%)}
  .sidebar.on{transform:translateX(0)}
  .content{padding:14px}
  .fg2,.fg3{grid-template-columns:1fr}
  .ham{display:block}
  .sgrid{grid-template-columns:1fr 1fr}
  .fbar input,.fbar select{max-width:100%;width:100%}
}
@media print{
  body{background:#fff;color:#000}
  .topbar,.sidebar,.btn,.fbar,.no-print,.modal-bg{display:none!important}
  #app{display:block;height:auto}
  .shell{display:block}
  .content{overflow:visible;padding:0}
  .card{border:1px solid #ddd;background:#fff}
  thead th,tbody td{color:#000!important;border-color:#ddd!important}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-grid"></div>
  <div class="login-glow"></div>
  <div class="login-box">
    <div class="login-brand">
      <span class="hrt">❤️</span>
      <h1>Bate Volta<br><span>do Amor</span></h1>
      <p>Sistema de Gestão · São João</p>

</div>

</div>

<div class="toast" id="toast"></div>

<script>

function mapVendaFromDB(v){return {id:v.id,nome:v.nome,whats:v.whats,email:v.email,embarque:v.embarque,destino:v.destino,data:v.data,valorTotal:Number(v.valor_total),valorPago:Number(v.valor_pago||0),desconto:Number(v.desconto||0),cortesia:v.cortesia,colab:v.colab,obs:v.obs,checkin:v.checkin,groupId:v.group_id,isComp:v.is_comp,compOf:v.comp_of,busId:v.bus_id,criadoPor:v.criado_por,addMonitor:v.add_monitor,autorizadoPor:v.autorizado_por,criado:v.criado}}
function mapVendaToDB(v){return {id:v.id,nome:v.nome,whats:v.whats,email:v.email,embarque:v.embarque,destino:v.destino,data:v.data,valor_total:v.valorTotal,valor_pago:v.valorPago,desconto:v.desconto||0,cortesia:v.cortesia||false,colab:v.colab,obs:v.obs,checkin:v.checkin,group_id:v.groupId,is_comp:v.isComp,comp_of:v.compOf,bus_id:v.busId,criado_por:v.criadoPor||'',add_monitor:v.addMonitor||false,autorizado_por:v.autorizadoPor||'',criado:v.criado}}

// Load all data from Supabase
async function loadDB(){
  showLoader(true);
  try{
    const [users,cidades,onibus,vendas,cfg] = await Promise.all([
      sb.from('users').select('*'),
      sb.from('cidades').select('*'),
      sb.from('onibus').select('*'),
      sb.from('vendas').select('*'),
      sb.from('config').select('*').eq('key','next_id').single()
    ]);
    if(users.error)throw users.error;
    if(cidades.error)throw cidades.error;
    if(onibus.error)throw onibus.error;
    if(vendas.error)throw vendas.error;
    db.users = users.data || [];
    db.cidades = (cidades.data||[]).map(c=>({id:c.id,nome:c.nome,preco:Number(c.preco),datas:c.datas||[],embarques:c.embarques||[]}));
    db.onibus = (onibus.data||[]).map(mapBusFromDB);
    db.vendas = (vendas.data||[]).map(mapVendaFromDB);
    db.nextId = cfg.data?.value ? Number(cfg.data.value) : 100;
    // Auto-archive buses whose travel date has passed (silent, persisted)
    await autoArchivePastBuses();
  }catch(e){
    console.error('Erro carregando dados:',e);
    toast('Erro ao conectar com o banco: '+e.message,'r');
  }
  showLoader(false);
}

// Auto-archive buses with past dates
async function autoArchivePastBuses(){
  const today=new Date().toISOString().slice(0,10);
  const toArchive=db.onibus.filter(b=>!b.arquivado&&b.data<today);
  for(const b of toArchive){
    b.arquivado=true;
    await dbSaveBus(b);
  }
}

// Save next_id to config
async function saveNextId(){
  await sb.from('config').update({value:db.nextId}).eq('key','next_id');
}

// Sync all changes after route allocation
async function syncRoute(destino,data){
  // Get current bus IDs in cloud for this route
  const {data:cloudBuses,error}=await sb.from('onibus').select('id').eq('destino',destino).eq('data',data);
  if(!error){
    const localIds=new Set(db.onibus.filter(b=>b.destino===destino&&b.data===data).map(b=>b.id));
    const toDelete=(cloudBuses||[]).filter(cb=>!localIds.has(cb.id)).map(cb=>cb.id);
    for(const id of toDelete){await dbDeleteBus(id)}
  }
  const vendas=db.vendas.filter(v=>v.destino===destino&&v.data===data);
  const buses=db.onibus.filter(b=>b.destino===destino&&b.data===data);
  for(const b of buses){await dbSaveBus(b)}
  for(const v of vendas){await dbSaveVenda(v)}
  await saveNextId();
}

// valorDevido = total menos desconto concedido
function devido(v){return Math.max(0,v.valorTotal-(v.desconto||0))}
function isPaid(v){return v.cortesia||v.valorPago>=devido(v)}
function pend(v){return v.cortesia?0:Math.max(0,devido(v)-v.valorPago)}
function pct(v){if(v.cortesia)return 100;const d=devido(v);return d?Math.min(100,Math.round(v.valorPago/d*100)):100}
function cidade(nome){return db.cidades.find(c=>c.nome===nome)}

// ══════════════════════════════════════════════════
// BUS ALLOCATION
// ══════════════════════════════════════════════════
function allocateRoute(destino,data){
  const pax=db.vendas.filter(v=>v.destino===destino&&v.data===data);
  // Clear existing assignments for this route
  pax.forEach(v=>v.busId=null);

  // Get or create at least one bus
  let buses=db.onibus.filter(b=>b.destino===destino&&b.data===data).sort((a,b)=>a.num-b.num);
  if(!buses.length&&pax.length){
    const b={id:'b'+newId(),destino,data,num:1,cap:48,monitorId:null,visivel:true,aluguel:0,custoMon:0,outros:[],criado:new Date().toISOString()};
    db.onibus.push(b);buses=[b];
  }
  if(!pax.length)return;

  const cap=buses[0]?buses[0].cap:48;

  // Build groups (titular + companions) and singles
  const groupMap={};
  const singles=[];
  pax.forEach(v=>{
    if(v.groupId){
      if(!groupMap[v.groupId])groupMap[v.groupId]=[];
      groupMap[v.groupId].push(v);
    } else {
      singles.push(v);
    }
  });
  const groups=Object.values(groupMap);

  // Total seats needed
  const total=pax.length;
  const needed=Math.max(1,Math.ceil(total/cap));
  while(buses.length<needed){
    const n=buses.length+1;
    const b={id:'b'+newId(),destino,data,num:n,cap,monitorId:null,visivel:true,aluguel:0,custoMon:0,outros:[],criado:new Date().toISOString()};
    db.onibus.push(b);buses.push(b);
  }

  // Group singles by embarque (largest groups first)
  const byEmb={};
  singles.forEach(v=>{if(!byEmb[v.embarque])byEmb[v.embarque]=[];byEmb[v.embarque].push(v)});
  const embGroups=Object.values(byEmb).sort((a,b)=>b.length-a.length);

  // Allocate — fill buses in order: groups first, then singles by embarque
  let busIdx=0,seatCount=0;

  function ensureBus(){
    if(seatCount>=buses[busIdx].cap){
      busIdx++;
      if(!buses[busIdx]){
        const n=busIdx+1;
        const b={id:'b'+newId(),destino,data,num:n,cap,monitorId:null,visivel:true,aluguel:0,custoMon:0,outros:[],criado:new Date().toISOString()};
        db.onibus.push(b);buses.push(b);
      }
      seatCount=0;
    }
  }

  groups.forEach(grp=>{
    // If group doesn't fit in current bus, move to next
    if(seatCount+grp.length>buses[busIdx].cap){
      busIdx++;
      if(!buses[busIdx]){
        const n=busIdx+1;
        const b={id:'b'+newId(),destino,data,num:n,cap,monitorId:null,visivel:true,aluguel:0,custoMon:0,outros:[],criado:new Date().toISOString()};
        db.onibus.push(b);buses.push(b);
      }
      seatCount=0;
    }
    grp.forEach(v=>{v.busId=buses[busIdx].id;seatCount++});
  });

  embGroups.forEach(eg=>{
    eg.forEach(v=>{
      ensureBus();
      v.busId=buses[busIdx].id;seatCount++;
    });
  });

  // Remove empty buses with no config
  const usedIds=new Set(pax.map(v=>v.busId));
  db.onibus=db.onibus.filter(b=>{
    if(b.destino!==destino||b.data!==data)return true;
    if(usedIds.has(b.id))return true;
    // Keep if it has any configuration
    if(b.monitorId||b.aluguel||b.custoMon||(b.outros&&b.outros.length))return true;
    return false;
  });

  // Renumber remaining buses for this route
  db.onibus.filter(b=>b.destino===destino&&b.data===data).sort((a,b)=>a.criado.localeCompare(b.criado)).forEach((b,i)=>b.num=i+1);
}

let CU=null;
let CP='';

async function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  showLoader(true);
  await loadDB();
  showLoader(false);
  const found=db.users.find(x=>x.username===u&&x.password===p&&x.ativo!==false);
  if(!found){document.getElementById('login-err').style.display='block';return}
  document.getElementById('login-err').style.display='none';
  CU=found;
  document.getElementById('app').classList.add('on');
  document.getElementById('login-screen').style.display='none';
  const badge=document.getElementById('tb-badge');
  badge.textContent=CU.role==='master'?'Master':CU.role==='admin'?'Admin':'Monitor';
  badge.className='tb-badge '+(CU.role==='master'?'badge-master':CU.role==='admin'?'badge-admin':'badge-monitor');
  document.getElementById('tb-user').textContent=CU.nome;
  buildSidebar();
  navigate(CU.role==='monitor'?'monitor':'dashboard');
  // Start auto-refresh every 15 seconds
  startAutoRefresh();
}

let refreshTimer=null;
function anyModalOpen(){
  return !!document.querySelector('.modal-bg.on');
}
function captureFilters(){
  // Save current values of all filter/search inputs on the page
  const state={};
  document.querySelectorAll('#content input, #content select').forEach(el=>{
    if(el.id)state[el.id]=el.value;
  });
  return state;
}
function restoreFilters(state){
  Object.entries(state).forEach(([id,val])=>{
    const el=document.getElementById(id);
    if(el&&el.value!==val){el.value=val}
  });
}
function startAutoRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(async()=>{
    if(!CU)return;
    // Don't disrupt the user while typing in a modal or form
    if(anyModalOpen())return;
    // Don't refresh if user is actively focused on an input (typing/filtering)
    const active=document.activeElement;
    if(active&&(active.tagName==='INPUT'||active.tagName==='SELECT'||active.tagName==='TEXTAREA'))return;
    const filterState=captureFilters();
    await loadDB();
    if(CP){
      const renders={dashboard:pgDashboard,venda:pgVenda,passageiros:pgPassageiros,onibus:pgOnibus,cidades:pgCidades,pendentes:pgPendentes,financeiro:pgFinanceiro,relatorios:pgRelatorios,usuarios:pgUsuarios,monitor:pgMonitor};
      if(renders[CP]){
        document.getElementById('content').innerHTML=renders[CP]();
        restoreFilters(filterState); // restore BEFORE afterRender so filtered views respect them
        afterRender(CP);
        if(CP==='cidades')bindCidadesPage();
        if(CP==='pendentes')bindPendPage();
        if(CP==='usuarios')bindUsuariosPage();
        if(CP==='monitor')bindMonitorPage();
      }
    }
  },60000);
}
function logout(){
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}
  CU=null;
  document.getElementById('app').classList.remove('on');
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('li-user').value='';
  document.getElementById('li-pass').value='';
}

];

function buildSidebar(){
  const nav=CU.role==='master'?NAV_MASTER:CU.role==='admin'?NAV_ADMIN:NAV_MONITOR;
  let html='';let open=false;
  nav.forEach(item=>{
    if(item.s){if(open)html+='</div>';html+=`<div class="sb-section"><div class="sb-label">${item.s}</div>`;open=true;}
    else html+=`<div class="nav-item" id="ni-${item.id}" data-nav="${item.id}"><span class="ni">${item.i}</span>${item.l}</div>`;
  });
  if(open)html+='</div>';
  document.getElementById('sidebar').innerHTML=html;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',()=>navigate(el.dataset.nav));
  });
}

function navigate(page){
  CP=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('ni-'+page);
  if(el)el.classList.add('active');
  closeSb();
  const renders={
    dashboard:pgDashboard,venda:pgVenda,passageiros:pgPassageiros,
    onibus:pgOnibus,cidades:pgCidades,pendentes:pgPendentes,
    financeiro:pgFinanceiro,relatorios:pgRelatorios,
    usuarios:pgUsuarios,monitor:pgMonitor
  };
  if(renders[page]){
    document.getElementById('content').innerHTML=renders[page]();
    afterRender(page);
  }
}

function afterRender(page){
  if(page==='passageiros')filterPass();
  if(page==='onibus')renderBusCards();
  if(page==='financeiro'){renderFinCharts();renderPCCards();}
  if(page==='dashboard'){
    const mb=document.querySelector('[data-toggle-money]');
    if(mb)mb.addEventListener('click',toggleMoney);
  }
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast on'+(type?' t'+type:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000);

  if(!m){
    m=document.createElement('div');
    m.id='modal-confirm';
    m.className='modal-bg';
    document.body.appendChild(m);
  }
  m.innerHTML=`
    <div class="modal" style="max-width:420px">
      <div class="modal-t">
        <span>⚠️ Confirmação</span>
        <button class="modal-close" data-cm-close>✕</button>

function openModalVenda(editId){
  editVendaId=editId||null;
  comps=[];
  // Build modal fresh
  let modal=document.getElementById('modal-venda');
  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-venda';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalVenda();

  // Attach handlers
  document.getElementById('v-dest').addEventListener('change',()=>onDestChange());
  document.getElementById('v-valor-pago').addEventListener('input',calcPay);
  document.getElementById('v-desconto').addEventListener('input',calcPay);
  document.getElementById('c-pago').addEventListener('input',calcCompPay);
  document.getElementById('v-cortesia').addEventListener('change',onCortesiaChange);
  document.getElementById('btn-show-comp').addEventListener('click',showAddComp);
  document.getElementById('btn-add-comp').addEventListener('click',addComp);
  document.getElementById('btn-hide-comp').addEventListener('click',hideAddComp);
  document.getElementById('btn-save-venda').addEventListener('click',salvarVenda);
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));

  // If editing, populate
  if(editVendaId){
    const v=db.vendas.find(x=>x.id===editVendaId);
    if(v){
      document.getElementById('mv-title').textContent='Editar Venda';
      document.getElementById('v-nome').value=v.nome;
      document.getElementById('v-whats').value=v.whats;
      document.getElementById('v-email').value=v.email||'';
      document.getElementById('v-dest').value=v.destino;
      onDestChange(v.data,v.embarque);
      document.getElementById('v-valor-pago').value=v.valorPago;
      document.getElementById('v-desconto').value=v.desconto||0;
      document.getElementById('v-colab').value=v.colab||'';
      document.getElementById('v-obs').value=v.obs||'';
      document.getElementById('v-cortesia').checked=!!v.cortesia;
      onCortesiaChange();
      calcPay();
      // Load companions from db (including their embarque + cortesia)
      if(v.groupId){
        const existing=db.vendas.filter(x=>x.groupId===v.groupId&&x.isComp&&x.compOf===editVendaId);
        comps=existing.map(x=>({tid:'t'+x.id,id:x.id,nome:x.nome,whats:x.whats,embarque:x.embarque,valorTotal:x.valorTotal,valorPago:x.valorPago,cortesia:!!x.cortesia}));
      }
    }
  } else {
    // NEW: auto-fill colaborador with logged-in user
    document.getElementById('v-colab').value=CU?CU.nome:'';
  }
  renderCompList();
  openM('modal-venda');
}

function onCortesiaChange(){
  const isCort=document.getElementById('v-cortesia').checked;
  const vpWrap=document.getElementById('vp-wrap');
  const payWrap=document.getElementById('pay-wrap');
  const descWrap=document.getElementById('desc-wrap');
  if(isCort){
    // Cortesia: payment & discount fields irrelevant
    vpWrap.style.opacity='.4';
    document.getElementById('v-valor-pago').disabled=true;
    document.getElementById('v-valor-pago').value='0';
    if(descWrap)descWrap.style.display='none';
    document.getElementById('v-desconto').value='0';
    payWrap.style.display='none';
  } else {
    vpWrap.style.opacity='1';
    document.getElementById('v-valor-pago').disabled=false;
    if(descWrap)descWrap.style.display='flex';
    calcPay();
  }
}

function onDestChange(selData,selEmb){
  const dest=document.getElementById('v-dest').value;
  const c=cidade(dest);
  const dataSel=document.getElementById('v-data');
  const embSel=document.getElementById('v-embarque');
  const totEl=document.getElementById('v-valor-total');
  const cEmbSel=document.getElementById('c-embarque');
  if(!c){
    dataSel.innerHTML='<option value="">Selecione o destino primeiro</option>';
    embSel.innerHTML='<option value="">Selecione o destino primeiro</option>';
    if(cEmbSel)cEmbSel.innerHTML='<option value="">Mesmo do titular</option>';
    totEl.value='';
    return;
  }
  // Only show today + future dates (but keep the already-selected date when editing, even if past)
  const hoje=new Date().toISOString().slice(0,10);
  const datasValidas=c.datas.filter(d=>d>=hoje||d===selData);
  dataSel.innerHTML='<option value="">Selecione a data</option>'+datasValidas.map(d=>`<option value="${d}"${d===selData?' selected':''}>${fmtD(d)}${d<hoje?' (data passada)':''}</option>`).join('');
  embSel.innerHTML='<option value="">Selecione o embarque</option>'+c.embarques.map(e=>`<option${e===selEmb?' selected':''}>${escHtml(e)}</option>`).join('');
  // Companion embarque options (with "same as titular" default)
  if(cEmbSel)cEmbSel.innerHTML='<option value="">Mesmo do titular</option>'+c.embarques.map(e=>`<option>${escHtml(e)}</option>`).join('');
  totEl.value=c.preco.toFixed(2);
  if(!document.getElementById('v-cortesia').checked)calcPay();
}

function calcPay(){
  const total=parseFloat(document.getElementById('v-valor-total').value)||0;
  const pago=parseFloat(document.getElementById('v-valor-pago').value)||0;
  const desc=parseFloat(document.getElementById('v-desconto').value)||0;
  const devido=Math.max(0,total-desc);
  const wrap=document.getElementById('pay-wrap');
  if(total>0){
    wrap.style.display='block';
    const p=devido>0?Math.min(100,Math.round(pago/devido*100)):100;
    document.getElementById('pay-bar').style.width=p+'%';
    document.getElementById('pay-bar').style.background=p>=100?'var(--gr)':p>=50?'var(--am)':'var(--r)';
    document.getElementById('pay-pct-l').textContent=desc>0?`${p}% pago (devido ${fmt(devido)} c/ desconto)`:p+'% pago';
    const r=devido-pago;
    document.getElementById('pay-rest-l').textContent=r>0?'Faltam '+fmt(r):'✓ Quitado';
    document.getElementById('pay-rest-l').style.color=r>0?'var(--am)':'var(--gr)';
  } else wrap.style.display='none';
}

function calcCompPay(){
  const total=parseFloat(document.getElementById('v-valor-total').value)||0;
  const pago=parseFloat(document.getElementById('c-pago').value)||0;
  const wrap=document.getElementById('c-pay-wrap');
  if(total>0&&pago>0){
    wrap.style.display='block';
    const p=Math.min(100,Math.round(pago/total*100));
    document.getElementById('c-pay-bar').style.width=p+'%';
    document.getElementById('c-pay-pct').textContent=p+'%';
    const r=total-pago;
    document.getElementById('c-pay-rest').textContent=r>0?'Faltam '+fmt(r):'✓';
  } else wrap.style.display='none';
}

let editCompTid=null; // when editing an existing companion in the list

function showAddComp(){
  editCompTid=null;
  document.getElementById('btn-add-comp').textContent='✓ Confirmar';
  document.getElementById('add-comp-form').style.display='block';
}
function hideAddComp(){
  editCompTid=null;
  document.getElementById('btn-add-comp').textContent='✓ Confirmar';
  document.getElementById('add-comp-form').style.display='none';
  document.getElementById('c-nome').value='';
  document.getElementById('c-whats').value='';
  document.getElementById('c-pago').value='';
  const ce=document.getElementById('c-embarque');if(ce)ce.value='';
  const cc=document.getElementById('c-cortesia');if(cc)cc.checked=false;
  document.getElementById('c-pay-wrap').style.display='none';
}
function addComp(){
  const nome=document.getElementById('c-nome').value.trim();
  if(!nome){toast('Nome do acompanhante obrigatório','r');return}
  const total=parseFloat(document.getElementById('v-valor-total').value)||0;
  const isCort=document.getElementById('c-cortesia').checked;
  const dados={
    nome,
    whats:document.getElementById('c-whats').value.trim(),
    embarque:document.getElementById('c-embarque').value||'', // '' = same as titular
    valorTotal:total,
    valorPago:isCort?0:(parseFloat(document.getElementById('c-pago').value)||0),
    cortesia:isCort
  };
  if(editCompTid){
    // Update existing companion in the array, preserving tid and db id
    const c=comps.find(x=>x.tid===editCompTid);
    if(c)Object.assign(c,dados);
    toast('✓ Acompanhante atualizado','g');
  } else {
    comps.push({tid:'t'+Date.now()+Math.random().toString(36).slice(2,5),...dados});
  }
  hideAddComp();
  renderCompList();
}
function editComp(tid){
  const c=comps.find(x=>x.tid===tid);
  if(!c)return;
  editCompTid=tid;
  document.getElementById('c-nome').value=c.nome;
  document.getElementById('c-whats').value=c.whats||'';
  const ce=document.getElementById('c-embarque');if(ce)ce.value=c.embarque||'';
  document.getElementById('c-pago').value=c.cortesia?'':c.valorPago;
  document.getElementById('c-cortesia').checked=!!c.cortesia;
  document.getElementById('btn-add-comp').textContent='✓ Salvar alteração';
  document.getElementById('add-comp-form').style.display='block';
  calcCompPay();
}
function removeComp(tid){
  comps=comps.filter(c=>c.tid!==tid);
  renderCompList();
}
function renderCompList(){
  document.getElementById('comp-count').textContent=comps.length?`(${comps.length})`:'';
  const el=document.getElementById('comp-list');
  if(!comps.length){
    el.innerHTML='<div style="font-size:.75rem;color:var(--g2);padding:4px 0">Nenhum acompanhante adicionado</div>';
    return;
  }
  el.innerHTML=comps.map(c=>{
    const p=c.valorTotal?Math.min(100,Math.round(c.valorPago/c.valorTotal*100)):100;
    const embLabel=c.embarque?`📍 ${escHtml(c.embarque)}`:'📍 mesmo do titular';
    const payLabel=c.cortesia?'<span style="color:var(--bl)">🎁 Cortesia</span>':`${fmt(c.valorPago)} de ${fmt(c.valorTotal)} ${p<100?'<span style="color:var(--am)">('+p+'%)</span>':'<span style="color:var(--gr)">✓</span>'}`;
    return`<div class="comp-item"><div style="flex:1"><div class="comp-name">${escHtml(c.nome)}</div><div class="comp-info">${escHtml(c.whats||'—')} · ${embLabel} · ${payLabel}</div></div><div style="display:flex;gap:5px"><button class="btn bg bxs" data-edit-comp="${c.tid}" title="Editar">✏️</button><button class="btn b-dng bxs" data-rm-comp="${c.tid}" title="Remover">✕</button></div></div>`;
  }).join('');
  el.querySelectorAll('[data-rm-comp]').forEach(b=>b.addEventListener('click',()=>removeComp(b.dataset.rmComp)));
  el.querySelectorAll('[data-edit-comp]').forEach(b=>b.addEventListener('click',()=>editComp(b.dataset.editComp)));
}

async function salvarVenda(){
  const nome=document.getElementById('v-nome').value.trim();
  const whats=document.getElementById('v-whats').value.trim();
  const destino=document.getElementById('v-dest').value;
  const data=document.getElementById('v-data').value;
  const embarque=document.getElementById('v-embarque').value;
  const valorTotal=parseFloat(document.getElementById('v-valor-total').value)||0;
  const valorPago=parseFloat(document.getElementById('v-valor-pago').value)||0;
  const email=document.getElementById('v-email').value.trim();
  const colab=document.getElementById('v-colab').value.trim();
  const obs=document.getElementById('v-obs').value.trim();
  const cortesia=document.getElementById('v-cortesia').checked;
  const desconto=cortesia?0:(parseFloat(document.getElementById('v-desconto').value)||0);
  const valorPagoFinal=cortesia?0:valorPago;

  if(!nome||!whats||!destino||!data||!embarque){toast('Preencha os campos obrigatórios','r');return}
  if(desconto>valorTotal){toast('Desconto maior que o valor total','r');return}
  if(!cortesia&&valorPago>valorTotal){toast('Valor pago maior que o total','r');return}

  showLoader(true);
  try{
    if(editVendaId){
      const v=db.vendas.find(x=>x.id===editVendaId);
      if(!v){toast('Erro: venda não encontrada','r');showLoader(false);return}
      Object.assign(v,{nome,whats,email,embarque,destino,data,valorTotal,valorPago:valorPagoFinal,desconto,colab,obs,cortesia});
      if(!v.groupId&&comps.length){v.groupId=newGid()}
      const existing=db.vendas.filter(x=>x.groupId===v.groupId&&x.isComp&&x.compOf===editVendaId);
      const keepIds=new Set(comps.filter(c=>c.id).map(c=>c.id));
      for(const ex of existing){
        if(!keepIds.has(ex.id)){
          await dbDeleteVenda(ex.id);
          db.vendas=db.vendas.filter(d=>d.id!==ex.id);
        }
      }
      for(const c of comps){
        const cEmb=c.embarque||embarque; // empty = same as titular
        if(c.id){
          const ex=db.vendas.find(d=>d.id===c.id);
          if(ex){Object.assign(ex,{nome:c.nome,whats:c.whats,embarque:cEmb,valorTotal:valorTotal,valorPago:c.cortesia?0:c.valorPago,cortesia:!!c.cortesia,destino,data})}
        } else {
          db.vendas.push({
            id:newId(),nome:c.nome,whats:c.whats||'',email:'',embarque:cEmb,destino,data,
            valorTotal:valorTotal,valorPago:c.cortesia?0:(c.valorPago||0),cortesia:!!c.cortesia,colab,obs:'',
            checkin:false,groupId:v.groupId,isComp:true,compOf:editVendaId,busId:null,
            criadoPor:CU?CU.nome:'',addMonitor:false,autorizadoPor:'',
            criado:new Date().toISOString()
          });
        }
      }
      allocateRoute(destino,data);
      await syncRoute(destino,data);
      closeM('modal-venda');
      toast('✓ Venda atualizada','g');
    } else {
      const titularId=newId();
      const gid=comps.length?newGid():null;
      const nv={
        id:titularId,nome,whats,email,embarque,destino,data,valorTotal,valorPago:valorPagoFinal,desconto,colab,obs,cortesia,
        checkin:false,groupId:gid,isComp:false,compOf:null,busId:null,
        criadoPor:CU?CU.nome:'',addMonitor:false,autorizadoPor:'',
        criado:new Date().toISOString()
      };
      db.vendas.push(nv);
      comps.forEach(c=>{
        const cEmb=c.embarque||embarque;
        db.vendas.push({
          id:newId(),nome:c.nome,whats:c.whats||'',email:'',embarque:cEmb,destino,data,
          valorTotal:valorTotal,valorPago:c.cortesia?0:(c.valorPago||0),cortesia:!!c.cortesia,colab,obs:'',
          checkin:false,groupId:gid,isComp:true,compOf:titularId,busId:null,
          criadoPor:CU?CU.nome:'',addMonitor:false,autorizadoPor:'',
          criado:new Date().toISOString()
        });
      });
      allocateRoute(destino,data);
      await syncRoute(destino,data);
      closeM('modal-venda');
      toast(`✓ ${1+comps.length} passageiro(s) registrado(s)`,'g');
    }
  }catch(e){
    console.error(e);
    toast('Erro: '+e.message,'r');
  }
  showLoader(false);
  navigate(CP);
}

function filterPass(){
  ['fp-n','fp-d','fp-dt','fp-p','fp-c'].forEach(id=>{
    const el=document.getElementById(id);
    if(el&&!el.dataset.bound){
      el.addEventListener('input',renderPassRows);
      el.addEventListener('change',renderPassRows);
      el.dataset.bound='1';
    }
  });
  renderPassRows();
}

function renderPassRows(){
  const n=(document.getElementById('fp-n')?.value||'').toLowerCase();
  const d=document.getElementById('fp-d')?.value||'';
  const dt=document.getElementById('fp-dt')?.value||'';
  const p=document.getElementById('fp-p')?.value||'';
  const cr=document.getElementById('fp-c')?.value||'';
  const list=db.vendas.filter(v=>
    (!n||v.nome.toLowerCase().includes(n))&&
    (!d||v.destino===d)&&
    (!dt||v.data===dt)&&
    (!cr||v.criadoPor===cr)&&
    (!p||(p==='pago'?(isPaid(v)&&!v.cortesia):p==='parcial'?(!isPaid(v)):p==='cortesia'?v.cortesia:true))
  ).sort((a,b)=>a.data.localeCompare(b.data)||a.nome.localeCompare(b.nome));
  const tb=document.getElementById('tbody-pass');
  if(!tb)return;
  if(!list.length){
    tb.innerHTML='<tr><td colspan="12" style="text-align:center;color:var(--g);padding:28px">Nenhum resultado encontrado</td></tr>';
    return;
  }
  tb.innerHTML=list.map((v,i)=>{
    const bus=db.onibus.find(b=>b.id===v.busId);
    const editBtn=v.isComp?`<button type="button" class="btn bg bxs" data-action="edit-titular" data-id="${v.compOf}" title="Editar titular do grupo">✏️</button>`:`<button type="button" class="btn bg bxs" data-action="edit-venda" data-id="${v.id}">✏️</button>`;
    const statusChip=v.cortesia?'<span class="chip cb">🎁 Cortesia</span>':isPaid(v)?(v.desconto>0?'<span class="chip cg">✓ Quitado</span> <span class="chip cb" style="font-size:.56rem">🏷️ desc. '+fmt(v.desconto)+'</span>':'<span class="chip cg">✓ Quitado</span>'):'<span class="chip ca">'+pct(v)+'%</span>';
    const creatorLabel=v.addMonitor?`<span class="chip ca" style="font-size:.56rem">🚌 monitor</span> ${escHtml(v.criadoPor||'')}`:escHtml(v.criadoPor||'—');
    return`<tr>
      <td style="color:var(--g2)">${i+1}</td>
      <td><strong>${escHtml(v.nome)}</strong>${v.isComp?'<span class="chip cb" style="margin-left:5px;font-size:.58rem">acomp</span>':v.groupId?'<span class="chip cw" style="margin-left:5px;font-size:.58rem">titular</span>':''}</td>
      <td>${escHtml(v.whats)}</td>
      <td style="color:var(--g)">${escHtml(v.embarque)}</td>
      <td><span class="chip cr">${escHtml(v.destino.split('–')[0].trim())}</span></td>
      <td>${fmtD(v.data)}</td>
      <td>${bus?`<span class="chip cw">#${bus.num}</span>`:'—'}</td>
      <td>${fmt(v.valorTotal)}</td>
      <td style="color:${isPaid(v)?'var(--gr)':'var(--am)'}">${v.cortesia?'—':fmt(v.valorPago)}</td>
      <td>${statusChip}</td>
      <td style="font-size:.72rem;color:var(--g)">${creatorLabel}</td>
      <td><div style="display:flex;gap:4px">${editBtn}<button type="button" class="btn b-dng bxs" data-action="del-venda" data-id="${v.id}" title="Excluir">🗑</button></div></td>
    </tr>`;
  }).join('');
  if(!tb.dataset.bound){
    tb.addEventListener('click',e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn||!tb.contains(btn))return;
      const id=parseInt(btn.dataset.id);
      const a=btn.dataset.action;
      if(a==='del-venda')delVenda(id);
      else if(a==='edit-venda'||a==='edit-titular')openModalVenda(id);
    });
    tb.dataset.bound='1';
  }
}

function delVenda(id){
  const v=db.vendas.find(x=>x.id===id);
  if(!v){toast('Venda não encontrada','r');return}
  const isCompTitular=!v.isComp&&v.groupId&&db.vendas.some(x=>x.compOf===id);
  const compCount=isCompTitular?db.vendas.filter(x=>x.compOf===id).length:0;
  const msg=isCompTitular
    ? `Este é um titular com ${compCount} acompanhante(s). Excluir vai remover TAMBÉM os acompanhantes. Deseja continuar?`
    : `Excluir o passageiro "${v.nome}"?`;
  confirmModal(msg,async()=>{
    showLoader(true);
    const destino=v.destino,data=v.data;
    try{
      if(isCompTitular){
        const idsToDel=[id,...db.vendas.filter(x=>x.compOf===id).map(x=>x.id)];
        for(const did of idsToDel){await dbDeleteVenda(did)}
        db.vendas=db.vendas.filter(x=>x.id!==id&&x.compOf!==id);
      } else {
        await dbDeleteVenda(id);
        db.vendas=db.vendas.filter(x=>x.id!==id);
      }
      allocateRoute(destino,data);
      await syncRoute(destino,data);
      toast('🗑 Removido','g');
    }catch(e){toast('Erro: '+e.message,'r')}
    showLoader(false);
    navigate(CP);
  });
}

// Rebuild the date dropdown based on the current "Exibir" (archive) filter
function refreshOnibusDateOptions(){
  const farq=document.getElementById('fo-arq')?.value||'ativos';
  const dsel=document.getElementById('fo-d');
  if(!dsel)return;
  const current=dsel.value;
  let buses=db.onibus.slice();
  if(farq==='ativos')buses=buses.filter(b=>!b.arquivado);
  else if(farq==='arquivados')buses=buses.filter(b=>b.arquivado);
  const datas=[...new Set(buses.map(b=>b.data))].sort();
  dsel.innerHTML='<option value="">Todas</option>'+datas.map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('');
  // Keep current selection only if still valid
  if(datas.includes(current))dsel.value=current;
}

function renderBusCards(){
  ['fo-d','fo-dt','fo-arq','fo-pl'].forEach(id=>{
    const el=document.getElementById(id);
    if(el&&!el.dataset.bound){
      el.addEventListener('change',()=>{
        if(el.id==='fo-arq')refreshOnibusDateOptions();
        renderBusCards();
      });
      el.dataset.bound='1';
    }
  });
  refreshOnibusDateOptions();
  const fd=document.getElementById('fo-d')?.value||'';
  const fdt=document.getElementById('fo-dt')?.value||'';
  const farq=document.getElementById('fo-arq')?.value||'ativos';
  const fpl=document.getElementById('fo-pl')?.value||'';
  let buses=db.onibus.filter(b=>(!fd||b.data===fd)&&(!fdt||b.destino===fdt));
  if(farq==='ativos')buses=buses.filter(b=>!b.arquivado);
  else if(farq==='arquivados')buses=buses.filter(b=>b.arquivado);
  // When filtering by planilhador, only show buses that contain at least one passenger from that person
  if(fpl)buses=buses.filter(b=>db.vendas.some(v=>v.busId===b.id&&v.criadoPor===fpl));
  buses=buses.sort((a,b)=>(a.arquivado?1:0)-(b.arquivado?1:0)||a.data.localeCompare(b.data)||a.num-b.num);
  const area=document.getElementById('bus-area');
  if(!area)return;
  if(!buses.length){area.innerHTML='<div style="color:var(--g);padding:32px;text-align:center">Nenhum ônibus encontrado com esses filtros.</div>';return}
  area.innerHTML=buses.map(b=>{
    let pax=db.vendas.filter(v=>v.busId===b.id);
    const paxView=fpl?pax.filter(v=>v.criadoPor===fpl):pax;
    const ocp=Math.round(pax.length/b.cap*100);
    const mon=db.users.find(u=>u.id===b.monitorId);
    const recFpl=fpl?paxView.reduce((s,v)=>s+v.valorPago,0):0;
    return`
      <div class="card" style="margin-bottom:14px${b.arquivado?';opacity:.7':''}">
        <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:12px">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--r);line-height:1">${b.num}</div>
          <div style="flex:1">
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700">${escHtml(b.destino)}</div>
            <div style="font-size:.72rem;color:var(--g);margin-top:1px">${fmtD(b.data)}</div>
            <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
              <span class="chip ${ocp>=90?'cr':ocp>=60?'ca':'cg'}">${pax.length}/${b.cap} assentos</span>
              ${mon?`<span class="chip cb">👤 ${escHtml(mon.nome)}</span>`:'<span class="chip cw">Sem monitor</span>'}
              ${!b.visivel?'<span class="chip cw">👁 Oculto</span>':''}
              ${b.arquivado?'<span class="chip cw">📦 Arquivado</span>':''}
              ${fpl?`<span class="chip ca">📋 ${escHtml(fpl)}: ${paxView.length} pass · ${fmt(recFpl)}</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn b-bl bsm" data-config-bus="${b.id}">⚙️ Configurar</button>
            <button class="btn ${b.arquivado?'b-grn':'bg'} bsm" data-arch-bus="${b.id}">${b.arquivado?'📤 Desarquivar':'📦 Arquivar'}</button>
            <button class="btn bg bsm no-print" data-print-bus="${b.id}">🖨️</button>
          </div>
        </div>
        <div class="prog-wrap">
          <div class="prog-hd"><span>Ocupação</span><span>${ocp}%</span></div>
          <div class="prog-bar"><div class="prog-fill" style="width:${ocp}%;background:${ocp>=90?'var(--r)':ocp>=60?'var(--am)':'var(--gr)'}"></div></div>
        </div>
        ${paxView.length?`<div class="tw"><table>
          <thead><tr><th>#</th><th>Nome</th><th>Embarque</th><th>WhatsApp</th><th>Status Pag.</th><th>Grupo</th><th>Planilhado por</th></tr></thead>
          <tbody>${paxView.map((p,i)=>`
            <tr><td style="font-family:'Bebas Neue',sans-serif;color:var(--r);font-size:.95rem">${i+1}</td>
            <td><strong>${escHtml(p.nome)}</strong>${p.cortesia?'<span class="chip cb" style="margin-left:5px;font-size:.56rem">🎁</span>':''}</td><td style="color:var(--g)">${escHtml(p.embarque)}</td><td>${escHtml(p.whats)}</td>
            <td>${p.cortesia?'<span class="chip cb">🎁 Cortesia</span>':isPaid(p)?'<span class="chip cg">✓</span>':'<span class="chip ca">'+pct(p)+'%</span>'}</td>
            <td>${p.isComp?'<span class="chip cb">Acomp.</span>':p.groupId?'<span class="chip cw">Titular</span>':''}</td>
            <td style="font-size:.72rem;color:var(--g)">${p.addMonitor?'<span class="chip ca" style="font-size:.54rem">🚌</span> ':''}${escHtml(p.criadoPor||'—')}</td></tr>`).join('')}
          </tbody>
        </table></div>`:'<div style="color:var(--g);font-size:.82rem;padding:10px 0">Nenhum passageiro neste ônibus</div>'}
      </div>`;
  }).join('');
  area.querySelectorAll('[data-config-bus]').forEach(b=>b.addEventListener('click',()=>openBusConfig(b.dataset.configBus)));
  area.querySelectorAll('[data-print-bus]').forEach(b=>b.addEventListener('click',()=>printBus(b.dataset.printBus)));
  area.querySelectorAll('[data-arch-bus]').forEach(b=>b.addEventListener('click',()=>toggleArchiveBus(b.dataset.archBus)));
}

async function toggleArchiveBus(bid){
  const b=db.onibus.find(x=>x.id===bid);
  if(!b)return;
  b.arquivado=!b.arquivado;
  showLoader(true);
  await dbSaveBus(b);
  showLoader(false);
  navigate(CP);
  toast(b.arquivado?'📦 Ônibus arquivado':'📤 Ônibus reativado','g');
}

function openBusConfig(bid){
  const b=db.onibus.find(x=>x.id===bid);
  if(!b){toast('Ônibus não encontrado','r');return}
  editBusId=bid;
  let modal=document.getElementById('modal-bus');
  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-bus';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalBus();
  document.getElementById('mb-title').textContent=`Ônibus ${b.num} — ${b.destino}`;
  document.getElementById('mb-cap').value=b.cap;
  document.getElementById('mb-vis').checked=b.visivel!==false;
  const monSel=document.getElementById('mb-monitor');
  const monitors=db.users.filter(u=>u.role==='monitor'&&u.ativo!==false);
  monSel.innerHTML='<option value="">Sem monitor</option>'+monitors.map(m=>`<option value="${m.id}"${b.monitorId===m.id?' selected':''}>${escHtml(m.nome)}</option>`).join('');
  document.getElementById('btn-save-bus').addEventListener('click',salvarBusConfig);
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));
  openM('modal-bus');
}

async function salvarBusConfig(){
  const b=db.onibus.find(x=>x.id===editBusId);
  if(!b)return;
  b.cap=parseInt(document.getElementById('mb-cap').value)||48;
  b.monitorId=document.getElementById('mb-monitor').value||null;
  b.visivel=document.getElementById('mb-vis').checked;
  allocateRoute(b.destino,b.data);
  showLoader(true);
  await syncRoute(b.destino,b.data);
  showLoader(false);
  closeM('modal-bus');
  navigate(CP);
  toast('✓ Ônibus configurado','g');
}

function openModalCidade(cid){
  editCidId=cid||null;

  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-cidade';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalCidade();
  document.getElementById('mc-title').textContent=cid?'Editar Cidade':'Nova Cidade';
  if(cid){
    const c=db.cidades.find(x=>x.id===cid);
    if(c){
      document.getElementById('ci-nome').value=c.nome;
      document.getElementById('ci-preco').value=c.preco;
      cidDatas=[...c.datas];
      cidEmbs=[...c.embarques];
    }
  } else {
    document.getElementById('ci-nome').value='';
    document.getElementById('ci-preco').value='';
  }
  renderCidDatas();
  renderCidEmbs();
  document.getElementById('btn-add-data').addEventListener('click',addDataCidade);
  document.getElementById('btn-add-emb').addEventListener('click',addEmbCidade);
  document.getElementById('btn-save-cidade').addEventListener('click',salvarCidade);
  document.getElementById('ci-data-input').addEventListener('keydown',e=>{if(e.key==='Enter')addDataCidade()});
  document.getElementById('ci-emb-input').addEventListener('keydown',e=>{if(e.key==='Enter')addEmbCidade()});
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));
  openM('modal-cidade');
}

function renderCidDatas(){
  const el=document.getElementById('ci-datas-list');
  if(!cidDatas.length){el.innerHTML='<span style="font-size:.75rem;color:var(--g2)">Nenhuma data adicionada</span>';return}
  el.innerHTML=cidDatas.map((d,i)=>`<span class="tag">${fmtD(d)}<button data-rm-data="${i}">✕</button></span>`).join('');
  el.querySelectorAll('[data-rm-data]').forEach(b=>b.addEventListener('click',()=>{cidDatas.splice(+b.dataset.rmData,1);renderCidDatas()}));
}
function renderCidEmbs(){
  const el=document.getElementById('ci-emb-list');
  if(!cidEmbs.length){el.innerHTML='<span style="font-size:.75rem;color:var(--g2)">Nenhum local adicionado</span>';return}
  el.innerHTML=cidEmbs.map((e,i)=>`<span class="tag">${escHtml(e)}<button data-rm-emb="${i}">✕</button></span>`).join('');
  el.querySelectorAll('[data-rm-emb]').forEach(b=>b.addEventListener('click',()=>{cidEmbs.splice(+b.dataset.rmEmb,1);renderCidEmbs()}));
}
function addDataCidade(){
  const d=document.getElementById('ci-data-input').value;
  if(!d){toast('Selecione uma data','r');return}
  if(cidDatas.includes(d)){toast('Data já adicionada','a');return}
  cidDatas.push(d);cidDatas.sort();renderCidDatas();
  document.getElementById('ci-data-input').value='';
}
function addEmbCidade(){
  const e=document.getElementById('ci-emb-input').value.trim();
  if(!e){toast('Digite o local','r');return}
  if(cidEmbs.includes(e)){toast('Local já adicionado','a');return}
  cidEmbs.push(e);renderCidEmbs();
  document.getElementById('ci-emb-input').value='';
}
async function salvarCidade(){
  const nome=document.getElementById('ci-nome').value.trim();
  const preco=parseFloat(document.getElementById('ci-preco').value)||0;
  if(!nome){toast('Nome obrigatório','r');return}
  if(!preco){toast('Preço obrigatório','r');return}
  showLoader(true);
  let c;
  if(editCidId){
    c=db.cidades.find(x=>x.id===editCidId);
    if(c){Object.assign(c,{nome,preco,datas:cidDatas,embarques:cidEmbs})}
  } else {
    c={id:'c'+newId(),nome,preco,datas:cidDatas,embarques:cidEmbs};
    db.cidades.push(c);
  }
  const ok=await dbSaveCidade(c);
  await saveNextId();
  showLoader(false);
  if(ok){
    closeM('modal-cidade');
    renderCitiesList();
    toast('✓ Cidade salva','g');
  }
}
function delCidade(cid){
  const c=db.cidades.find(x=>x.id===cid);
  if(!c)return;
  const using=db.vendas.filter(v=>v.destino===c.nome);
  const msg=using.length
    ? `A cidade "${c.nome}" tem ${using.length} venda(s) registrada(s). Excluir mesmo assim?`
    : `Excluir cidade "${c.nome}"?`;
  confirmModal(msg,async()=>{
    showLoader(true);
    const ok=await dbDeleteCidade(cid);
    if(ok){
      db.cidades=db.cidades.filter(x=>x.id!==cid);
      renderCitiesList();
      toast('🗑 Cidade removida','g');
    }
    showLoader(false);
  });
}

function pgFinanceiro(){
  const v=db.vendas;
  const totalTotal=v.filter(x=>!x.cortesia).reduce((s,x)=>s+x.valorTotal,0);
  const totalPago=v.reduce((s,x)=>s+x.valorPago,0);
  const totalCustos=db.onibus.reduce((s,b)=>s+(b.aluguel||0)+(b.custoMon||0)+(b.outros||[]).reduce((ss,o)=>ss+o.val,0),0);
  const lucro=totalPago-totalCustos;
  const cortesias=v.filter(x=>x.cortesia);
  const cortesiaCount=cortesias.length;
  const cortesiaValor=cortesias.reduce((s,x)=>s+x.valorTotal,0);
  return`
    <div class="ph"><h2>Financeiro</h2><p>Visão geral e prestação de contas</p></div>
    <div class="sgrid">
      <div class="sc"><div class="sc-icon">📋</div><div class="sc-lbl">Esperado</div><div class="sc-val">${fmt(totalTotal)}</div><div class="sc-sub">exclui cortesias</div></div>
      <div class="sc"><div class="sc-icon">✅</div><div class="sc-lbl">Recebido</div><div class="sc-val" style="color:var(--gr)">${fmt(totalPago)}</div></div>
      <div class="sc"><div class="sc-icon">💸</div><div class="sc-lbl">Custos Totais</div><div class="sc-val" style="color:var(--am)">${fmt(totalCustos)}</div></div>
      <div class="sc"><div class="sc-icon">📊</div><div class="sc-lbl">Lucro Líquido</div><div class="sc-val" style="color:${lucro>=0?'var(--gr)':'var(--r2)'}">${fmt(lucro)}</div></div>
      <div class="sc"><div class="sc-icon">🎁</div><div class="sc-lbl">Cortesias</div><div class="sc-val" style="color:var(--bl)">${cortesiaCount}</div><div class="sc-sub">equiv. ${fmt(cortesiaValor)} não cobrado</div></div>
    </div>
    ${renderPrestacaoContas()}`;
}

// Rebuild the PC date dropdown based on archive filter
function refreshPCDateOptions(){
  const farq=document.getElementById('fpc-arq')?.value||'ativos';
  const dsel=document.getElementById('fpc-d');
  if(!dsel)return;
  const current=dsel.value;
  let buses=db.onibus.slice();
  if(farq==='ativos')buses=buses.filter(b=>!b.arquivado);
  else if(farq==='arquivados')buses=buses.filter(b=>b.arquivado);
  const datas=[...new Set(buses.map(b=>b.data))].sort();
  dsel.innerHTML='<option value="">Todas</option>'+datas.map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('');
  if(datas.includes(current))dsel.value=current;
}

function renderPCCards(){
  ['fpc-d','fpc-dt','fpc-arq'].forEach(id=>{
    const el=document.getElementById(id);
    if(el&&!el.dataset.bound){
      el.addEventListener('change',()=>{
        if(el.id==='fpc-arq')refreshPCDateOptions();
        renderPCCards();
      });
      el.dataset.bound='1';
    }
  });
  refreshPCDateOptions();
  const fd=document.getElementById('fpc-d')?.value||'';
  const fdt=document.getElementById('fpc-dt')?.value||'';
  const farq=document.getElementById('fpc-arq')?.value||'ativos';
  let buses=db.onibus.filter(b=>(!fd||b.data===fd)&&(!fdt||b.destino===fdt));
  if(farq==='ativos')buses=buses.filter(b=>!b.arquivado);
  else if(farq==='arquivados')buses=buses.filter(b=>b.arquivado);
  buses=buses.sort((a,b)=>(a.arquivado?1:0)-(b.arquivado?1:0)||a.data.localeCompare(b.data)||a.num-b.num);
  const area=document.getElementById('pc-area');
  if(!area)return;
  if(!buses.length){area.innerHTML='<div class="card" style="color:var(--g);text-align:center">Nenhum ônibus encontrado com esses filtros.</div>';return}

  // Consolidated totals across filtered buses
  let gRec=0,gCusto=0;
  buses.forEach(b=>{
    const pax=db.vendas.filter(v=>v.busId===b.id);
    gRec+=pax.reduce((s,v)=>s+v.valorPago,0);
    gCusto+=(b.aluguel||0)+(b.custoMon||0)+(b.outros||[]).reduce((s,o)=>s+o.val,0);
  });
  const gLucro=gRec-gCusto;

  const cards=buses.map(b=>{
    const pax=db.vendas.filter(v=>v.busId===b.id);
    const outros=b.outros||[];
    const totalCusto=(b.aluguel||0)+(b.custoMon||0)+outros.reduce((s,o)=>s+o.val,0);
    const rec=pax.reduce((s,v)=>s+v.valorPago,0);
    const lucroB=rec-totalCusto;
    // Arrecadação por responsável
    const byPlan={};
    pax.forEach(v=>{
      const k=v.criadoPor||'(sem responsável)';
      if(!byPlan[k])byPlan[k]={count:0,rec:0,cortesias:0};
      byPlan[k].count++;
      byPlan[k].rec+=v.valorPago;
      if(v.cortesia)byPlan[k].cortesias++;
    });
    const planRows=Object.entries(byPlan).sort((a,b)=>b[1].rec-a[1].rec).map(([nome,s])=>`
      <tr><td><strong>${escHtml(nome)}</strong></td><td>${s.count}${s.cortesias?` <span style="font-size:.62rem;color:var(--bl)">(${s.cortesias} cortesia)</span>`:''}</td><td style="color:var(--gr);font-weight:700">${fmt(s.rec)}</td></tr>`).join('')
      ||'<tr><td colspan="3" style="color:var(--g);text-align:center;padding:14px">Nenhum passageiro</td></tr>';
    return`
      <div class="card" style="margin-bottom:14px${b.arquivado?';opacity:.8':''}">
        <div class="card-t" style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          🚌 Ônibus ${b.num} — ${escHtml(b.destino)} · ${fmtD(b.data)}
          ${b.arquivado?'<span class="chip cw">📦 arquivado</span>':''}
          <span class="chip cg" style="margin-left:auto">${pax.length} passageiros</span>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;font-size:.78rem">
          <div style="background:var(--k3);border-radius:2px;padding:12px"><div style="color:var(--g);margin-bottom:3px">Receita (arrecadado)</div><div style="font-weight:700;color:var(--gr);font-size:1rem">${fmt(rec)}</div></div>
          <div style="background:var(--k3);border-radius:2px;padding:12px"><div style="color:var(--g);margin-bottom:3px">Custos</div><div style="font-weight:700;color:var(--am);font-size:1rem">${fmt(totalCusto)}</div></div>
          <div style="background:var(--k3);border-radius:2px;padding:12px"><div style="color:var(--g);margin-bottom:3px">Lucro</div><div style="font-weight:700;color:${lucroB>=0?'var(--gr)':'var(--r2)'};font-size:1rem">${fmt(lucroB)}</div></div>
        </div>

        <div style="margin-bottom:16px"><button class="btn b-bl bsm" data-pc-open-cfg="${b.id}">⚙️ Configurar custos${totalCusto>0?` (${fmt(totalCusto)})`:''}</button></div>

        <div class="lbl" style="margin-bottom:8px">👥 Arrecadação por responsável</div>
        <div class="tw"><table>
          <thead><tr><th>Responsável (planilhou)</th><th>Passageiros</th><th>Arrecadado</th></tr></thead>
          <tbody>${planRows}
            <tr style="border-top:2px solid var(--bdr)"><td style="font-weight:700">TOTAL</td><td style="font-weight:700">${pax.length}</td><td style="font-weight:700;color:var(--gr)">${fmt(rec)}</td></tr>
          </tbody>
        </table></div>
      </div>`;
  }).join('');

  area.innerHTML=`
    <div class="sgrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="sc"><div class="sc-icon">✅</div><div class="sc-lbl">Receita (filtro)</div><div class="sc-val" style="color:var(--gr)">${fmt(gRec)}</div></div>
      <div class="sc"><div class="sc-icon">💸</div><div class="sc-lbl">Custos (filtro)</div><div class="sc-val" style="color:var(--am)">${fmt(gCusto)}</div></div>
      <div class="sc"><div class="sc-icon">📊</div><div class="sc-lbl">Lucro (filtro)</div><div class="sc-val" style="color:${gLucro>=0?'var(--gr)':'var(--r2)'}">${fmt(gLucro)}</div></div>
    </div>
    ${cards}`;

  // Open cost config modal
  area.querySelectorAll('[data-pc-open-cfg]').forEach(btn=>btn.addEventListener('click',()=>openCustosModal(btn.dataset.pcOpenCfg)));
}

// ── Cost config modal ──

      <input type="text" value="${escHtml(o.nome)}" style="flex:2" data-mc-oc-nome="${i}" placeholder="Descrição">
      <input type="number" value="${o.val}" style="flex:1" data-mc-oc-val="${i}" placeholder="R$">
      <button class="btn b-dng bxs" data-mc-rm-oc="${i}">✕</button>
    </div>`).join('');
  return`
    <div class="modal">
      <div class="modal-t"><span>⚙️ Custos — Ônibus ${b.num}</span><button class="modal-close" data-close="modal-custos">✕</button></div>
      <div style="font-size:.78rem;color:var(--g);margin-bottom:14px">${escHtml(b.destino)} · ${fmtD(b.data)}</div>
      <div class="fg2">
        <div class="f"><label class="lbl">Aluguel do Ônibus (R$)</label><input type="number" id="mc-aluguel" value="${b.aluguel||''}" placeholder="0.00" step="0.01"></div>
        <div class="f"><label class="lbl">Custo do Monitor (R$)</label><input type="number" id="mc-customon" value="${b.custoMon||''}" placeholder="0.00" step="0.01"></div>
      </div>
      <div style="margin-top:14px">
        <div class="lbl" style="margin-bottom:8px">Outros Custos</div>
        <div id="mc-outros">${outrosRows||'<div style="font-size:.74rem;color:var(--g);margin-bottom:6px">Nenhum outro custo</div>'}</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input type="text" id="mc-noc-nome" placeholder="Descrição (ex: pedágio)" style="flex:2">
          <input type="number" id="mc-noc-val" placeholder="R$" style="flex:1">
          <button class="btn bg bsm" id="mc-add-oc">+</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn br" id="mc-save">✅ Salvar custos</button>
        <button class="btn bg" data-close="modal-custos">Cancelar</button>

let custosBusId=null;
function openCustosModal(bid){
  const b=db.onibus.find(x=>x.id===bid);
  if(!b)return;
  custosBusId=bid;
  // Work on a temp copy of outros so edits only commit on save
  custosOutros=JSON.parse(JSON.stringify(b.outros||[]));
  let modal=document.getElementById('modal-custos');
  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-custos';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalCustos(b);
  bindCustosModal();
  openM('modal-custos');
}

let custosOutros=[];
function renderCustosOutros(){
  const el=document.getElementById('mc-outros');
  if(!el)return;
  el.innerHTML=custosOutros.length?custosOutros.map((o,i)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <input type="text" value="${escHtml(o.nome)}" style="flex:2" data-mc-oc-nome="${i}" placeholder="Descrição">
      <input type="number" value="${o.val}" style="flex:1" data-mc-oc-val="${i}" placeholder="R$">
      <button class="btn b-dng bxs" data-mc-rm-oc="${i}">✕</button>
    </div>`).join(''):'<div style="font-size:.74rem;color:var(--g);margin-bottom:6px">Nenhum outro custo</div>';
  el.querySelectorAll('[data-mc-oc-nome]').forEach(inp=>inp.addEventListener('change',e=>{custosOutros[+e.target.dataset.mcOcNome].nome=e.target.value}));
  el.querySelectorAll('[data-mc-oc-val]').forEach(inp=>inp.addEventListener('change',e=>{custosOutros[+e.target.dataset.mcOcVal].val=parseFloat(e.target.value)||0}));
  el.querySelectorAll('[data-mc-rm-oc]').forEach(b=>b.addEventListener('click',()=>{custosOutros.splice(+b.dataset.mcRmOc,1);renderCustosOutros()}));
}
function bindCustosModal(){
  const modal=document.getElementById('modal-custos');
  document.getElementById('mc-add-oc').addEventListener('click',()=>{
    const nome=(document.getElementById('mc-noc-nome').value||'').trim();
    const val=parseFloat(document.getElementById('mc-noc-val').value)||0;
    if(!nome){toast('Digite a descrição do custo','r');return}
    custosOutros.push({nome,val});
    document.getElementById('mc-noc-nome').value='';
    document.getElementById('mc-noc-val').value='';
    renderCustosOutros();
  });
  document.getElementById('mc-save').addEventListener('click',saveCustosModal);
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));
  renderCustosOutros();
}
async function saveCustosModal(){
  const b=db.onibus.find(x=>x.id===custosBusId);
  if(!b)return;
  b.aluguel=parseFloat(document.getElementById('mc-aluguel').value)||0;
  b.custoMon=parseFloat(document.getElementById('mc-customon').value)||0;
  b.outros=custosOutros.filter(o=>(o.nome||'').trim());
  showLoader(true);
  await dbSaveBus(b);
  showLoader(false);
  closeM('modal-custos');
  renderPCCards();
  toast('✓ Custos atualizados','g');
}

function renderFinCharts(){
  const byDest={};
  db.vendas.forEach(v=>{byDest[v.destino]=(byDest[v.destino]||0)+v.valorPago});
  const maxV=Math.max(...Object.values(byDest),1);
  let h='<div class="cbar-wrap" style="height:110px">';
  Object.entries(byDest).sort((a,b)=>b[1]-a[1]).forEach(([d,r])=>{
    const ht=Math.round(r/maxV*90);
    h+=`<div class="cbar-col"><div class="cbar-v">${(r/1000).toFixed(1)}k</div><div class="cbar" style="height:${ht}px"></div><div class="cbar-l">${escHtml(d.split('–')[0].trim())}</div></div>`;
  });
  if(!Object.keys(byDest).length)h+='<span style="color:var(--g);font-size:.8rem">Sem dados</span>';
  h+='</div>';
  const el=document.getElementById('fin-chart');
  if(el)el.innerHTML=h;
}

let editUserId=null;

function pgUsuarios(){
  return`
    <div class="ph"><h2>Usuários</h2><p>Gerencie os acessos do sistema</p></div>
    <div style="margin-bottom:14px"><button class="btn br" id="btn-new-user">+ Novo Usuário</button></div>
    <div class="card" style="padding:0">
      <div class="tw"><table>
        <thead><tr><th>Nome</th><th>Username</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tbody-users"></tbody>
      </table></div>
    </div>`;
}

function renderUsers(){
  const tb=document.getElementById('tbody-users');
  if(!tb)return;
  tb.innerHTML=db.users.map(u=>`
    <tr>
      <td><strong>${escHtml(u.nome)}</strong></td>
      <td style="color:var(--g);font-family:monospace">${escHtml(u.username)}</td>
      <td>${u.role==='master'?'<span class="chip cr">Master</span>':u.role==='admin'?'<span class="chip ca">Admin</span>':'<span class="chip cb">Monitor</span>'}</td>
      <td>${u.ativo!==false?'<span class="chip cg">Ativo</span>':'<span class="chip cw">Inativo</span>'}</td>
      <td>${u.role!=='master'?`<div style="display:flex;gap:4px"><button type="button" class="btn bg bxs" data-action="edit-user" data-id="${u.id}">✏️</button><button type="button" class="btn b-dng bxs" data-action="toggle-user" data-id="${u.id}">${u.ativo!==false?'🚫':'✓'}</button><button type="button" class="btn b-dng bxs" data-action="del-user" data-id="${u.id}">🗑</button></div>`:'<span style="color:var(--g)">—</span>'}</td>
    </tr>`).join('');
  if(!tb.dataset.bound){
    tb.addEventListener('click',e=>{
      const btn=e.target.closest('[data-action]');
      if(!btn)return;
      const id=btn.dataset.id;
      if(btn.dataset.action==='edit-user')openModalUser(id);
      else if(btn.dataset.action==='toggle-user')toggleUser(id);
      else if(btn.dataset.action==='del-user')delUser(id);
    });
    tb.dataset.bound='1';
  }
}

function bindUsuariosPage(){
  const btn=document.getElementById('btn-new-user');
  if(btn&&!btn.dataset.bound){btn.addEventListener('click',()=>openModalUser());btn.dataset.bound='1';}
  renderUsers();
}

function buildModalUser(){
  return `
    <div class="modal">
      <div class="modal-t"><span id="mu-title">Novo Usuário</span><button class="modal-close" data-close="modal-user">✕</button></div>
      <div class="fg2">
        <div class="f"><label class="lbl">Nome *</label><input type="text" id="u-nome" placeholder="Nome completo"></div>
        <div class="f"><label class="lbl">Username *</label><input type="text" id="u-user" placeholder="nome.sobrenome"></div>
        <div class="f"><label class="lbl">Senha ${'<span id="u-pass-hint" style="color:var(--g2);font-weight:400;text-transform:none">(deixe em branco para manter)</span>'}</label><input type="password" id="u-pass" placeholder="••••••••"></div>
        <div class="f"><label class="lbl">Perfil *</label><select id="u-role"><option value="admin">Admin</option><option value="monitor">Monitor</option></select></div>
      </div>
      <div class="btn-row">
        <button class="btn br" id="btn-save-user">✅ Salvar</button>
        <button class="btn bg" data-close="modal-user">Cancelar</button>
      </div>
    </div>
  `;
}

function openModalUser(uid){
  editUserId=uid||null;
  let modal=document.getElementById('modal-user');
  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-user';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalUser();
  document.getElementById('mu-title').textContent=uid?'Editar Usuário':'Novo Usuário';
  document.getElementById('u-pass-hint').style.display=uid?'inline':'none';
  if(uid){
    const u=db.users.find(x=>x.id===uid);
    if(u){
      document.getElementById('u-nome').value=u.nome;
      document.getElementById('u-user').value=u.username;
      document.getElementById('u-pass').value='';
      document.getElementById('u-role').value=u.role;
    }
  } else {
    document.getElementById('u-nome').value='';
    document.getElementById('u-user').value='';
    document.getElementById('u-pass').value='';
    document.getElementById('u-role').value='admin';
  }
  document.getElementById('btn-save-user').addEventListener('click',salvarUser);
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));
  openM('modal-user');
}

async function salvarUser(){
  const nome=document.getElementById('u-nome').value.trim();
  const username=document.getElementById('u-user').value.trim();
  const pass=document.getElementById('u-pass').value;
  const role=document.getElementById('u-role').value;
  if(!nome||!username){toast('Nome e username obrigatórios','r');return}
  if(!editUserId&&!pass){toast('Senha obrigatória para novo usuário','r');return}
  const dup=db.users.find(u=>u.username===username&&u.id!==editUserId);
  if(dup){toast('Username já existe','r');return}
  showLoader(true);
  let u;
  if(editUserId){
    u=db.users.find(x=>x.id===editUserId);
    if(u){u.nome=nome;u.username=username;u.role=role;if(pass)u.password=pass}
  } else {
    u={id:'u'+newId(),nome,username,password:pass,role,ativo:true};
    db.users.push(u);
  }
  const ok=await dbSaveUser(u);
  await saveNextId();
  showLoader(false);
  if(ok){
    closeM('modal-user');
    renderUsers();
    toast('✓ Usuário salvo','g');
  }
}

async function toggleUser(uid){
  const u=db.users.find(x=>x.id===uid);
  if(!u)return;
  u.ativo=u.ativo===false?true:false;
  showLoader(true);
  await dbSaveUser(u);
  showLoader(false);
  renderUsers();
  toast(u.ativo?'✓ Usuário ativado':'🚫 Usuário desativado','g');
}

function delUser(uid){
  const u=db.users.find(x=>x.id===uid);
  if(!u)return;
  confirmModal(`Excluir o usuário "${u.nome}"? Esta ação não pode ser desfeita.`,async()=>{
    showLoader(true);
    // Clear monitor_id on any bus assigned to this user
    for(const b of db.onibus){
      if(b.monitorId===uid){
        b.monitorId=null;
        await dbSaveBus(b);
      }
    }
    const ok=await dbDeleteUser(uid);
    if(ok){
      db.users=db.users.filter(x=>x.id!==uid);
      renderUsers();
      toast('🗑 Usuário removido','g');
    }
    showLoader(false);
  });
}
