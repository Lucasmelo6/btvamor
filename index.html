let activeBusIdx=0;

function pgMonitor(){
  let myBuses;
  if(CU.role==='monitor'){
    myBuses=db.onibus.filter(b=>b.monitorId===CU.id&&b.visivel!==false&&!b.arquivado);
  } else {
    myBuses=db.onibus.filter(b=>b.visivel!==false&&!b.arquivado);
  }
  myBuses=myBuses.sort((a,b)=>a.data.localeCompare(b.data)||a.num-b.num);
  if(!myBuses.length){
    return`<div class="ph"><h2>Meus Ônibus</h2></div>
      <div style="color:var(--g);padding:48px;text-align:center;font-size:.9rem">
        Nenhum ônibus atribuído ao seu perfil ou nenhuma viagem ativa.<br>
        <span style="font-size:.75rem;color:var(--g2)">Aguarde o administrador configurar seu ônibus.</span>
      </div>`;
  }
  if(activeBusIdx>=myBuses.length)activeBusIdx=0;
  const currentBus=myBuses[activeBusIdx];
  const pax=db.vendas.filter(v=>v.busId===currentBus.id).sort((a,b)=>a.nome.localeCompare(b.nome));
  const checked=pax.filter(p=>p.checkin).length;
  const missing=pax.length-checked;
  const pendPay=pax.filter(p=>!isPaid(p)).length;
  const ckPct=pax.length?Math.round(checked/pax.length*100):0;
  const vagas=currentBus.cap-pax.length;
  return`
    <div class="ph"><h2>Meus Ônibus</h2><p>Check-in de passageiros</p></div>
    <div class="sgrid" style="grid-template-columns:repeat(4,1fr)">
      <div class="sc"><div class="sc-lbl">Total</div><div class="sc-val">${pax.length}</div><div class="sc-sub">${vagas} vaga(s) livre(s)</div></div>
      <div class="sc"><div class="sc-lbl">Check-in</div><div class="sc-val" style="color:var(--gr)">${checked}</div></div>
      <div class="sc"><div class="sc-lbl">Faltando</div><div class="sc-val" style="color:${missing>0?'var(--r2)':'var(--gr)'}">${missing}</div></div>
      <div class="sc"><div class="sc-lbl">Pag. Pendente</div><div class="sc-val" style="color:var(--am)">${pendPay}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      ${myBuses.map((b,i)=>{
        const p2=db.vendas.filter(v=>v.busId===b.id);
        const ch=p2.filter(v=>v.checkin).length;
        return`<button class="btn ${i===activeBusIdx?'br':'bg'} bsm" data-select-bus="${i}" style="flex-direction:column;gap:2px;line-height:1.3">
          <span>🚌 Ônibus ${b.num}</span>
          <span style="font-size:.62rem;opacity:.8">${escHtml(b.destino.split('–')[0].trim())} · ${fmtD(b.data)}</span>
          <span style="font-size:.62rem">${ch}/${p2.length} check-in</span>
        </button>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
      <button class="btn bg bsm" data-ci-filter="all">Todos (${pax.length})</button>
      <button class="btn bg bsm" data-ci-filter="missing">Faltando (${missing})</button>
      <button class="btn bg bsm" data-ci-filter="present">Presentes (${checked})</button>
      ${pendPay?`<button class="btn b-am bsm" data-ci-filter="pend">⚠️ Pag. pendente (${pendPay})</button>`:''}
      <button class="btn br bsm" id="btn-monitor-add" style="margin-left:auto">+ Adicionar passageiro</button>
    </div>
    <div class="prog-wrap">
      <div class="prog-hd"><span>Check-in — Ônibus ${currentBus.num}</span><span>${ckPct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${ckPct}%;background:${ckPct===100&&pax.length>0?'var(--gr)':ckPct>50?'var(--am)':'var(--r)'}"></div></div>
    </div>
    <div id="ci-list">
      ${pax.length?pax.map((p,i)=>{
        const creatorTag=p.addMonitor
          ? `<span class="chip ca" style="font-size:.56rem">🚌 add. monitor${p.autorizadoPor?' · autoriz: '+escHtml(p.autorizadoPor):''}</span>`
          : (p.criadoPor?`<span class="chip cw" style="font-size:.56rem">por ${escHtml(p.criadoPor)}</span>`:'');
        return`
        <div class="ci-card ${p.checkin?'present':'absent'}" id="ci-${p.id}" data-toggle-ci="${p.id}">
          <div class="ci-inner">
            <div class="ci-av">${p.checkin?'✓':escHtml(p.nome.charAt(0).toUpperCase())}</div>
            <div class="ci-info">
              <div class="ci-name">${i+1}. ${escHtml(p.nome)}${p.isComp?'<span class="chip cb" style="margin-left:6px;font-size:.58rem">acomp</span>':p.groupId?'<span class="chip cw" style="margin-left:6px;font-size:.58rem">titular</span>':''}${p.cortesia?'<span class="chip cb" style="margin-left:6px;font-size:.58rem">🎁 cortesia</span>':''}</div>
              <div class="ci-sub">
                <span>📍 ${escHtml(p.embarque)}</span>
                <span>📱 ${escHtml(p.whats)}</span>
                ${creatorTag}
                ${!isPaid(p)?`<span class="pay-warn">⚠️ ${fmt(pend(p))} pendente</span>`:''}
              </div>
            </div>
            <div class="ci-status"><span class="chip ${p.checkin?'cg':'cr'}">${p.checkin?'✓ Presente':'Ausente'}</span></div>
          </div>
        </div>`;
      }).join(''):'<div style="color:var(--g);text-align:center;padding:28px">Nenhum passageiro neste ônibus</div>'}
    </div>`;
}

function bindMonitorPage(){
  document.querySelectorAll('[data-select-bus]').forEach(b=>b.addEventListener('click',()=>{activeBusIdx=parseInt(b.dataset.selectBus);navigate('monitor')}));
  document.querySelectorAll('[data-ci-filter]').forEach(b=>b.addEventListener('click',()=>ciFilter(b.dataset.ciFilter)));
  document.querySelectorAll('[data-toggle-ci]').forEach(b=>b.addEventListener('click',()=>toggleCheckin(parseInt(b.dataset.toggleCi))));
  const addBtn=document.getElementById('btn-monitor-add');
  if(addBtn)addBtn.addEventListener('click',openModalMonitorAdd);
}

        ⚠️ Este passageiro entrará na lista marcado como "adicionado pelo monitor". O administrador fará a conferência depois.

      <div class="fg1">

        <div class="f"><label class="lbl">Quem autorizou? * <span style="color:var(--g2);font-weight:400;text-transform:none">(nome do admin)</span></label><input type="text" id="ma-autoriz" placeholder="Ex: Lucas"></div>

function openModalMonitorAdd(){
  let myBuses;
  if(CU.role==='monitor')myBuses=db.onibus.filter(b=>b.monitorId===CU.id&&b.visivel!==false&&!b.arquivado);
  else myBuses=db.onibus.filter(b=>b.visivel!==false&&!b.arquivado);
  myBuses=myBuses.sort((a,b)=>a.data.localeCompare(b.data)||a.num-b.num);
  const bus=myBuses[activeBusIdx];
  if(!bus){toast('Selecione um ônibus','r');return}
  let modal=document.getElementById('modal-monitor-add');
  if(!modal){
    modal=document.createElement('div');
    modal.id='modal-monitor-add';
    modal.className='modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML=buildModalMonitorAdd();
  // Embarque options from the city of this bus
  const c=cidade(bus.destino);
  const embSel=document.getElementById('ma-embarque');
  embSel.innerHTML=(c&&c.embarques.length?c.embarques:[bus.destino]).map(e=>`<option>${escHtml(e)}</option>`).join('');
  document.getElementById('btn-save-monitor-add').addEventListener('click',()=>salvarMonitorAdd(bus));
  modal.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>closeM(el.dataset.close)));
  openM('modal-monitor-add');
}

async function salvarMonitorAdd(bus){
  const nome=document.getElementById('ma-nome').value.trim();
  const autoriz=document.getElementById('ma-autoriz').value.trim();
  if(!nome){toast('Nome obrigatório','r');return}
  if(!autoriz){toast('Informe quem autorizou','r');return}
  const c=cidade(bus.destino);
  const preco=c?c.preco:0;
  const nv={
    id:newId(),nome,whats:document.getElementById('ma-whats').value.trim(),email:'',
    embarque:document.getElementById('ma-embarque').value,destino:bus.destino,data:bus.data,
    valorTotal:preco,valorPago:0,cortesia:false,
    colab:CU.nome,obs:document.getElementById('ma-obs').value.trim(),
    checkin:false,groupId:null,isComp:false,compOf:null,busId:bus.id,
    criadoPor:CU.nome,addMonitor:true,autorizadoPor:autoriz,
    criado:new Date().toISOString()
  };
  db.vendas.push(nv);
  showLoader(true);
  // Direct assign to this bus (don't re-allocate, monitor chose this bus explicitly)
  await dbSaveVenda(nv);
  await saveNextId();
  showLoader(false);
  closeM('modal-monitor-add');
  navigate('monitor');
  toast('✓ Passageiro adicionado à lista','g');
}

async function toggleCheckin(id){
  const v=db.vendas.find(x=>x.id===id);
  if(!v)return;
  v.checkin=!v.checkin;
  await dbSaveVenda(v);
  navigate('monitor');
  toast(v.checkin?`✓ ${v.nome} — presente`:`${v.nome} — ausente`,v.checkin?'g':'');
}

function ciFilter(type){
  document.querySelectorAll('.ci-card').forEach(c=>{
    const id=parseInt(c.id.replace('ci-',''));
    const v=db.vendas.find(x=>x.id===id);
    if(!v)return;
    let show=true;
    if(type==='present')show=v.checkin;
    else if(type==='missing')show=!v.checkin;
    else if(type==='pend')show=!isPaid(v);
    c.style.display=show?'':'none';
  });
}

function ph(title){return`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;font-size:12px;padding:20px}h1{color:#D90429;font-size:17px;margin-bottom:3px}h2{font-size:13px;margin:18px 0 7px;background:#111;color:#f4a800;padding:5px 9px}table{width:100%;border-collapse:collapse;margin-bottom:14px}th{background:#1a1a1a;color:#fff;padding:6px;text-align:left;font-size:10px}td{padding:5px 6px;border-bottom:1px solid #eee}strong{font-weight:700}.hdr{border-bottom:2px solid #D90429;margin-bottom:14px;padding-bottom:10px;display:flex;justify-content:space-between}.info{font-size:10px;color:#666}@media print{button{display:none}}</style></head><body><div class="hdr"><div><h1>❤️ Bate Volta do Amor</h1><div class="info">${title} · ${new Date().toLocaleString('pt-BR')}</div></div></div>`}

function doPrint(html){
  const w=window.open('','_blank');
  if(!w){toast('Permita pop-ups para imprimir','r');return}
  w.document.write(html+'</body></html>');
  w.document.close();
  setTimeout(()=>w.print(),400);
}

function printOnibus(){
  const fd=document.getElementById('rr-d')?.value||'';
  const fdt=document.getElementById('rr-dt')?.value||'';
  const buses=db.onibus.filter(b=>(!fd||b.data===fd)&&(!fdt||b.destino===fdt)).sort((a,b)=>a.data.localeCompare(b.data)||a.num-b.num);
  if(!buses.length){toast('Nenhum ônibus encontrado','r');return}
  let html=ph('Lista por Ônibus');
  buses.forEach(b=>{
    const pax=db.vendas.filter(v=>v.busId===b.id).sort((a,b)=>a.nome.localeCompare(b.nome));
    const mon=db.users.find(u=>u.id===b.monitorId);
    html+=`<h2>🚌 Ônibus ${b.num} — ${escHtml(b.destino)} · ${fmtD(b.data)} (${pax.length}/${b.cap}) ${mon?'· Monitor: '+escHtml(mon.nome):''}</h2>
    <table><thead><tr><th>#</th><th>Nome</th><th>Embarque</th><th>WhatsApp</th><th>Total</th><th>Pago</th><th>Pendente</th><th>Grupo</th></tr></thead><tbody>`;
    pax.forEach((p,i)=>{html+=`<tr><td>${i+1}</td><td><strong>${escHtml(p.nome)}</strong></td><td>${escHtml(p.embarque)}</td><td>${escHtml(p.whats)}</td><td>${fmt(p.valorTotal)}</td><td>${fmt(p.valorPago)}</td><td style="${pend(p)>0?'color:orange;font-weight:bold':''}">${fmt(pend(p))}</td><td>${p.isComp?'Acomp.':p.groupId?'Titular':''}</td></tr>`});
    html+='</tbody></table>';
  });
  doPrint(html);
}

function printGeral(){
  const fd=document.getElementById('rr2-d')?.value||'';
  const fdt=document.getElementById('rr2-dt')?.value||'';
  const list=db.vendas.filter(v=>(!fd||v.data===fd)&&(!fdt||v.destino===fdt)).sort((a,b)=>a.data.localeCompare(b.data)||a.nome.localeCompare(b.nome));
  if(!list.length){toast('Nenhum passageiro','r');return}
  const tot=list.reduce((s,v)=>s+v.valorTotal,0);
  const pag=list.reduce((s,v)=>s+v.valorPago,0);
  let html=ph('Lista Geral de Passageiros');
  html+=`<table><thead><tr><th>#</th><th>Nome</th><th>Embarque</th><th>Destino</th><th>Data</th><th>Ônibus</th><th>WhatsApp</th><th>Total</th><th>Pago</th><th>Pendente</th></tr></thead><tbody>`;
  list.forEach((v,i)=>{const b=db.onibus.find(x=>x.id===v.busId);html+=`<tr><td>${i+1}</td><td>${escHtml(v.nome)}</td><td>${escHtml(v.embarque)}</td><td>${escHtml(v.destino)}</td><td>${fmtD(v.data)}</td><td>${b?'#'+b.num:'—'}</td><td>${escHtml(v.whats)}</td><td>${fmt(v.valorTotal)}</td><td>${fmt(v.valorPago)}</td><td>${fmt(pend(v))}</td></tr>`});
  html+=`</tbody></table><p><strong>Esperado: ${fmt(tot)} · Recebido: ${fmt(pag)} · Pendente: ${fmt(tot-pag)}</strong></p>`;
  doPrint(html);
}

function printFin(){
  const fd=document.getElementById('rr3-d')?.value||'';
  const list=db.vendas.filter(v=>!fd||v.data===fd);
  const tot=list.reduce((s,v)=>s+v.valorTotal,0);
  const pag=list.reduce((s,v)=>s+v.valorPago,0);
  const custos=db.onibus.filter(b=>!fd||b.data===fd).reduce((s,b)=>s+(b.aluguel||0)+(b.custoMon||0)+(b.outros||[]).reduce((ss,o)=>ss+o.val,0),0);
  let html=ph('Relatório Financeiro');
  html+=`<table style="max-width:400px"><thead><tr><th>Indicador</th><th>Valor</th></tr></thead><tbody>
    <tr><td>Passageiros</td><td>${list.length}</td></tr>
    <tr><td>Receita esperada</td><td>${fmt(tot)}</td></tr>
    <tr><td>Receita recebida</td><td style="color:green">${fmt(pag)}</td></tr>
    <tr><td>Pendente</td><td style="color:orange">${fmt(tot-pag)}</td></tr>
    <tr><td>Custos totais</td><td style="color:orange">${fmt(custos)}</td></tr>
    <tr><td><strong>Lucro líquido</strong></td><td style="color:${pag-custos>=0?'green':'red'};font-weight:bold">${fmt(pag-custos)}</td></tr>
  </tbody></table>`;
  doPrint(html);
}

function printPend(){
  const list=db.vendas.filter(v=>!isPaid(v)).sort((a,b)=>pend(b)-pend(a));
  if(!list.length){toast('Sem pendências!','g');return}
  let html=ph('Relatório de Pendências');
  html+=`<table><thead><tr><th>Nome</th><th>Destino</th><th>Data</th><th>Total</th><th>Pago</th><th>Falta</th><th>%</th><th>WhatsApp</th></tr></thead><tbody>`;
  list.forEach(v=>{html+=`<tr><td>${escHtml(v.nome)}</td><td>${escHtml(v.destino)}</td><td>${fmtD(v.data)}</td><td>${fmt(v.valorTotal)}</td><td>${fmt(v.valorPago)}</td><td style="color:orange;font-weight:bold">${fmt(pend(v))}</td><td>${pct(v)}%</td><td>${escHtml(v.whats)}</td></tr>`});
  html+=`</tbody></table><p><strong style="color:orange">Total pendente: ${fmt(list.reduce((s,v)=>s+pend(v),0))}</strong></p>`;
  doPrint(html);
}

function printBus(bid){
  const b=db.onibus.find(x=>x.id===bid);
  if(!b)return;
  const pax=db.vendas.filter(v=>v.busId===bid).sort((a,b)=>a.nome.localeCompare(b.nome));
  const mon=db.users.find(u=>u.id===b.monitorId);
  let html=ph(`Ônibus ${b.num} — ${b.destino} · ${fmtD(b.data)}`);
  if(mon)html+=`<p style="margin-bottom:10px">Monitor: <strong>${escHtml(mon.nome)}</strong></p>`;
  html+=`<table><thead><tr><th>#</th><th>Nome</th><th>Embarque</th><th>WhatsApp</th><th>Total</th><th>Pago</th><th>Pendente</th></tr></thead><tbody>`;
  pax.forEach((p,i)=>{html+=`<tr><td>${i+1}</td><td>${escHtml(p.nome)}</td><td>${escHtml(p.embarque)}</td><td>${escHtml(p.whats)}</td><td>${fmt(p.valorTotal)}</td><td>${fmt(p.valorPago)}</td><td>${fmt(pend(p))}</td></tr>`});
  html+='</tbody></table>';
  doPrint(html);
}

function exportCSV(){
  if(!db.vendas.length){toast('Nenhuma venda para exportar','r');return}
  const h=['ID','Nome','WhatsApp','Email','Embarque','Destino','Data','Ônibus','Total','Pago','Pendente','% Pago','Colaborador','Grupo','Acompanhante','Check-in','Criado'];
  const rows=db.vendas.map(v=>{
    const b=db.onibus.find(x=>x.id===v.busId);
    return[v.id,v.nome,v.whats,v.email||'',v.embarque,v.destino,fmtD(v.data),b?b.num:'',v.valorTotal.toFixed(2).replace('.',','),v.valorPago.toFixed(2).replace('.',','),pend(v).toFixed(2).replace('.',','),pct(v)+'%',v.colab||'',v.groupId||'',v.isComp?'Sim':'Não',v.checkin?'Sim':'Não',new Date(v.criado).toLocaleString('pt-BR')];
  });
  const csv=[h,...rows].map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='btv-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('📥 CSV exportado','g');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  const a=t.dataset.action;
  if(a==='open-venda')openModalVenda();
  else if(a==='nav-pendentes')navigate('pendentes');
  else if(a==='nav-onibus')navigate('onibus');
  else if(a==='print-onibus')printOnibus();
  else if(a==='print-geral')printGeral();
  else if(a==='print-fin')printFin();
  else if(a==='print-pend')printPend();
  else if(a==='export-csv')exportCSV();
});

// Hook page-specific bindings after navigate
const _navigate=navigate;
window.navigate=function(page){
  _navigate(page);
  if(page==='cidades')bindCidadesPage();
  if(page==='pendentes')bindPendPage();
  if(page==='usuarios')bindUsuariosPage();
  if(page==='monitor')bindMonitorPage();
};

// Theme (default: light) — saved per browser
function applyTheme(theme){
  if(theme==='dark'){
    document.body.classList.remove('light');
    document.getElementById('btn-theme').textContent='☀️';
  } else {
    document.body.classList.add('light');
    document.getElementById('btn-theme').textContent='🌙';
  }
  try{localStorage.setItem('btv_theme',theme)}catch(e){}
}
function toggleTheme(){
  const isLight=document.body.classList.contains('light');
  applyTheme(isLight?'dark':'light');
}
// Apply saved theme or default to light
(function(){
  let saved='light';
  try{saved=localStorage.getItem('btv_theme')||'light'}catch(e){}
  applyTheme(saved);
})();

document.getElementById('btn-theme').addEventListener('click',toggleTheme);

document.getElementById('li-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
